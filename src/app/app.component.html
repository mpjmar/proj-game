<h1>Catálogo de juegos</h1>

<div class="searchContainer">
  <div class="search">
    <label for="gameId">Buscar videojuego por ID:</label>
    <input #id id="gameId" type="text" placeholder="Introduce id" />
    <button type="button" (click)="searchGameById(id.value)">Buscar</button>
  </div>

  <div class="selectGenre">
    <label for="genreSelect">Selecciona el género:</label>
    <select
      id="genreSelect"
      #genreSelect
      (change)="onGenreChange(genreSelect.value)"
    >
      <option value="Todos">Todos</option>
      <option value="Action">Action</option>
      <option value="Adventure">Adventure</option>
      <option value="RPG">RPG</option>
      <option value="Racing">Racing</option>
      <option value="Simulation">Simulation</option>
      <option value="Sports">Sports</option>
      <option value="Strategy">Strategy</option>
    </select>
  </div>

  <div class="selectPlatform">
    <label for="platformSelect">Selecciona la plataforma:</label>
    <select
      id="platformSelect"
      #platformSelect
      (change)="onPlatformChange(platformSelect.value)"
    >
      <option value="Todas">Todas</option>
      <option value="PC">PC</option>
      <option value="PlayStation">PlayStation</option>
      <option value="Xbox">Xbox</option>
      <option value="Switch">Switch</option>
    </select>
  </div>

  <div class="title">
    <label for="gameTitle">Buscar videojuego por título:</label>
    <input #title id="gameTitle" type="text" placeholder="Introduce título" />
    <button type="button" (click)="onSearchGamesByTitle(title.value)">
      Buscar
    </button>
  </div>

  <div class="global">
    <input #query type="text" placeholder="Buscar juegos" />
    <button type="button" (click)="searchGames(query.value)">Buscar</button>
  </div>

  <div class="price">
    <span>Buscar por precio (€) </span>
    <div class="price-inputs">
      <input #minPrice type="number" placeholder="Min" />
      <input #maxPrice type="number" placeholder="Máx" />
      <button (click)="onSearchByPrice(minPrice.value, maxPrice.value)">
        Filtrar
      </button>
    </div>
  </div>
</div>

<section>
  @for (game of games; track game.id) {
    <div class="game-card">
      <h2>{{ game.title }}</h2>
      <p>{{ game.genre }}</p>
      <p>{{ game.platform }}</p>
      <p>Precio: {{ game.price | currency: "EUR" }}</p>
    </div>
  } @empty {
    <span class="empty">No se encuentran juegos</span>
  }
</section>

<div class="pages-container">
  <div style="display: flex; align-items: center; gap: 12px">
    <label for="pageSize">Videojuegos por página:</label>
    <select
      id="pageSize"
      class="size-select"
      [value]="pageSize"
      (change)="onPageSizeChange($any($event.target).value)"
    >
      <option value="5">5</option>
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="20">20</option>
    </select>
  </div>

  <div class="page-controls">
    <button (click)="prevPage()" [disabled]="currentPage === 1">
      Anterior
    </button>

    <span> Página {{ currentPage }} de {{ totalPages }} </span>

    <button (click)="nextPage()" [disabled]="currentPage >= totalPages">
      Siguiente
    </button>
  </div>
</div>

<h1>CRUD</h1>
<app-crud></app-crud>
