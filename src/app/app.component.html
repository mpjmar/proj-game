<h1>Catálogo de juegos</h1>

<div class="searchContainer">
  <div class="search">
    <label for="gameId">Buscar videojuego por ID:</label>
    <input #id id="gameId" type="text" />
    <button type="button" (click)="searchGameById(id.value)">Buscar</button>
  </div>

  <div class="selectGenre">
    <label for="genreSelect">Selecciona el género:</label>
    <select
      id="genreSelect"
      #genreSelect
      (change)="onGenreChange(genreSelect.value)"
    >
      <option value="Todos">Todos</option>
      <option value="Action">Action</option>
      <option value="Adventure">Adventure</option>
      <option value="RPG">RPG</option>
      <option value="Racing">Racing</option>
      <option value="Simulation">Simulation</option>
      <option value="Sports">Sports</option>
      <option value="Strategy">Strategy</option>
    </select>
  </div>

  <div class="selectPlatform">
    <label for="platformSelect">Selecciona la plataforma:</label>
    <select
      id="platformSelect"
      #platformSelect
      (change)="onPlatformChange(platformSelect.value)"
    >
      <option value="Todas">Todas</option>
      <option value="PC">PC</option>
      <option value="PlayStation">PlayStation</option>
      <option value="Xbox">Xbox</option>
      <option value="Switch">Switch</option>
    </select>
  </div>

  <div class="title">
    <label for="gameTitle">Buscar videojuego por título:</label>
    <input id="gameTitle" type="text" #title />
    <button type="button" (click)="searchGamesByTitle(title.value)">
      Buscar
    </button>
  </div>
</div>

<section>
  @for (game of games; track game.id) {
    <div class="game-card">
      <h2>{{ game.title }}</h2>
      <p>{{ game.genre }}</p>
      <p>{{ game.platform }}</p>
      <p>Precio: {{ game.price | currency: "EUR" }}</p>
    </div>
  }
</section>
